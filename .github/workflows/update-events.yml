name: Update hackathons

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Collect events
        run: node scripts/fetch-events.mjs
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
      - name: Save changes
        run: |
          git config user.name "hackradar-bot"
          git config user.email "hackradar-bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Update hackathons" && git push)
